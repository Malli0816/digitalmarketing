# Copy this file to /etc/nginx/sites-available/digital-marketing
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/digital-marketing;
    index index.html;

    access_log /var/log/nginx/digital-marketing-access.log;
    error_log  /var/log/nginx/digital-marketing-error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Redirect the old/default landing path to the main homepage.
    location = /home {
        return 301 /;
    }

    # Keep browser access limited to real files and pages.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
